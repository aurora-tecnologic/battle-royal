<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Battle Royale Táctico - Comando Central</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050b14;
      --panel-bg: rgba(13, 22, 38, 0.9);
      --neon-cyan: #00f0ff;
      --neon-gold: #fbbf24;
      --neon-red: #f43f5e;
      --border-glow: rgba(0, 240, 255, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at center, #0a1424 0%, var(--bg-deep) 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow: hidden;
      touch-action: none;
    }
    .tactical-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      width: 100%;
      max-width: 440px;
      padding: 25px;
      text-align: center;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0,240,255,0.4);
    }
    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { font-size: 0.75rem; color: var(--neon-cyan); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; display: block; margin-bottom: 5px; }
    input {
      width: 100%; padding: 12px; background: #020617; border: 1px solid #1e293b;
      border-radius: 8px; color: #fff; font-size: 1rem; outline: none; font-family: 'Rajdhani', sans-serif;
    }
    input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; cursor: pointer; margin-top: 10px; letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .btn-cyan { background: linear-gradient(135deg, #00f0ff, #0284c7); color: #020617; box-shadow: 0 4px 15px rgba(0,240,255,0.3); }
    .btn-cyan:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,240,255,0.5); }
    .btn-outline { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .btn-outline:hover { background: rgba(0,240,255,0.1); }
    .error { color: var(--neon-red); font-size: 0.8rem; margin-top: 10px; font-weight: 600; }
    .hidden { display: none !important; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.92); z-index: 100; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-box {
      background: #0b1329; border: 1px solid var(--neon-cyan); border-radius: 14px;
      width: 100%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 0 30px rgba(0,240,255,0.2);
    }
    .modal-header { padding: 15px 20px; background: #070d1a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr; gap: 12px; }

    .weapon-card {
      background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 10px;
      padding: 14px; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s;
    }
    .weapon-card:hover { border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.03); }
    .weapon-info { text-align: left; }
    .weapon-name { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: #fff; }
    .weapon-stats { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .weapon-price { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--neon-gold); margin-bottom: 6px; }

    /* ---------- PANTALLA DE COMBATE 3D ---------- */
    #gameScreen { display: none; position: fixed; inset: 0; z-index: 50; background: #08130f; }
    #threeContainer { width: 100%; height: 100%; }
    #threeContainer canvas { display: block; touch-action: none; }
    #combatHud {
      position: fixed; top: 12px; left: 12px; z-index: 55;
      background: var(--panel-bg); backdrop-filter: blur(10px);
      border: 1px solid var(--border-glow); border-radius: 10px; padding: 10px 16px; min-width: 180px;
    }
    #combatHud .opName { font-family:'Orbitron',sans-serif; font-size:0.85rem; color:var(--neon-cyan); }
    #hpBarOuter { width: 160px; height: 12px; background:#1e293b; border-radius:6px; overflow:hidden; margin-top:6px; }
    #hpBarFill { height:100%; background: linear-gradient(90deg,#f43f5e,#fb923c); width:100%; transition: width .2s; }
    #shieldBarOuter { width: 160px; height: 6px; background:#1e293b; border-radius:6px; overflow:hidden; margin-top:4px; }
    #shieldBarFill { height:100%; background: linear-gradient(90deg,#00f0ff,#0284c7); width:0%; transition: width .2s; }
    #matchStatus {
      position: fixed; top: 12px; right: 12px; z-index: 55; color: var(--neon-gold);
      font-family: 'Orbitron', sans-serif; font-size: 0.8rem; text-align: right;
      background: var(--panel-bg); border: 1px solid var(--border-glow); border-radius: 10px; padding: 8px 14px;
    }
    #killfeed {
      position: fixed; top: 70px; right: 12px; z-index: 55; text-align: right;
      font-size: 0.8rem; color: #e2e8f0; max-width: 260px;
    }
    #killfeed div { background: rgba(2,6,23,0.7); padding: 5px 10px; border-radius: 6px; margin-bottom: 4px; border-left: 3px solid var(--neon-red); }
    #controlsHint {
      position: fixed; bottom: 175px; left: 12px; z-index: 55; color: #64748b;
      font-size: 0.7rem; background: var(--panel-bg); padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border-glow);
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 18px; height: 18px; z-index: 54; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content:''; position:absolute; background: var(--neon-cyan);
    }
    #crosshair::before { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
    #crosshair::after { height: 100%; width: 2px; left: 50%; transform: translateX(-50%); }
    #endOverlay {
      display:none; position: fixed; inset:0; z-index: 60; background: rgba(2,6,23,0.9);
      justify-content:center; align-items:center; flex-direction:column;
    }
    #endOverlay h2 { font-family:'Orbitron',sans-serif; color: var(--neon-gold); font-size: 1.8rem; text-shadow: 0 0 20px rgba(251,191,36,0.5); margin-bottom: 16px; }

    /* ---------- CONTROLES TÁCTILES ---------- */
    #joystickZone {
      position:fixed; bottom:30px; left:30px; width:130px; height:130px; z-index:56; touch-action:none;
    }
    #joystickBase {
      width:100%; height:100%; border-radius:50%;
      background:rgba(0,240,255,0.08); border:2px solid rgba(0,240,255,0.3);
    }
    #joystickStick {
      position:absolute; top:35px; left:35px; width:60px; height:60px; border-radius:50%;
      background:rgba(0,240,255,0.5); border:2px solid #00f0ff; pointer-events:none;
    }
    #fireBtn {
      position:fixed; bottom:50px; right:30px; width:90px; height:90px; border-radius:50%; z-index:56;
      background:linear-gradient(135deg,#f43f5e,#b91c1c); border:2px solid #fca5a5; color:#fff;
      font-family:'Orbitron',sans-serif; font-size:0.7rem; font-weight:700; touch-action:none;
    }
    #fireBtn:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="tactical-card" id="loginScreen">
    <h1>BATTLE ROYALE</h1>
    <div class="subtitle">Interfaz Táctica v3.1 · 3D</div>

    <div id="authForm">
      <div class="input-group">
        <label>Número Celular / WhatsApp</label>
        <input type="tel" id="phoneInput" placeholder="+57 300 0000000">
      </div>
      <div class="input-group">
        <label>Nombre de Operativo</label>
        <input type="text" id="nameInput" placeholder="Ej. Ghost_07">
      </div>
      <button class="btn btn-cyan" onclick="register()">Registrar e Ingresar</button>
      <button class="btn btn-outline" onclick="login()">Acceso Rápido (Login)</button>
      <div class="error" id="authError"></div>
    </div>

    <div id="dashboard" class="hidden">
      <div style="background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1e293b;">
        <div style="font-size: 0.8rem; color: #64748b; text-transform: uppercase;">Operativo Activo</div>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--neon-cyan); margin: 4px 0;" id="dashName">--</div>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--neon-gold);">💵 $<span id="dashMoney">0</span></div>
      </div>
      <button class="btn btn-cyan" onclick="findMatch()">🎮 Buscar Partida en la Nube</button>
      <button class="btn btn-outline" onclick="openShop()">🛒 Arsenal y Tienda</button>
      <button class="btn btn-outline" style="border-color: var(--neon-red); color: var(--neon-red); margin-top: 20px;" onclick="location.reload()">Cerrar Sesión</button>
      <div class="error" id="lobbyStatus" style="color:var(--neon-cyan); margin-top:14px;"></div>
    </div>
  </div>

  <!-- SHOP MODAL -->
  <div class="modal" id="shopModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 1rem;">🛒 Arsenal Militar</h3>
        <button class="btn btn-cyan" style="width: auto; padding: 4px 12px; margin:0;" onclick="closeShop()">X</button>
      </div>
      <div class="modal-body" id="shopGrid"></div>
    </div>
  </div>

  <!-- PANTALLA DE COMBATE 3D -->
  <div id="gameScreen">
    <div id="threeContainer"></div>
    <div id="crosshair"></div>
    <div id="combatHud">
      <div class="opName" id="opName">--</div>
      <div id="hpBarOuter"><div id="hpBarFill"></div></div>
      <div id="shieldBarOuter"><div id="shieldBarFill"></div></div>
    </div>
    <div id="matchStatus">Esperando...</div>
    <div id="killfeed"></div>
    <div id="controlsHint">Joystick: moverte · Botón rojo: disparar al enemigo más cercano</div>

    <!-- CONTROLES TÁCTILES -->
    <div id="joystickZone">
      <div id="joystickBase"></div>
      <div id="joystickStick"></div>
    </div>
    <button id="fireBtn">FUEGO</button>

    <div id="endOverlay">
      <h2 id="endMessage">--</h2>
      <button class="btn btn-cyan" style="width:auto; padding:12px 30px;" onclick="location.reload()">Volver al Comando</button>
    </div>
  </div>

  <script>
    const socket = io();
    let player = null;

    // ---------- ESTADO DE PARTIDA ----------
    let myId = null;
    let matchId = null;
    let players = {};       // id -> { x, y, rotation, hp, shield, name, alive }
    let meshes = {};        // id -> { group, nameSprite }
    const keys = {};
    const MOVE_SPEED = 4;
    let lastSent = 0;
    let loopRunning = false;

    // ---------- AUTH ----------
    function register() {
      const phone = document.getElementById('phoneInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      if(!phone || !name) return document.getElementById('authError').textContent = 'Completa todos los campos.';
      socket.emit('auth:register', { phone, name });
    }
    function login() {
      const phone = document.getElementById('phoneInput').value.trim();
      if(!phone) return document.getElementById('authError').textContent = 'Ingresa tu número.';
      socket.emit('auth:login', { phone });
    }
    socket.on('auth:success', (data) => {
      player = data.player;
      document.getElementById('authForm').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('dashName').textContent = player.name;
      document.getElementById('dashMoney').textContent = player.money;
    });
    socket.on('auth:error', (msg) => { document.getElementById('authError').textContent = msg; });

    // ---------- TIENDA ----------
    function openShop() { socket.emit('shop:getCatalog'); document.getElementById('shopModal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shopModal').style.display = 'none'; }
    socket.on('shop:catalog', (catalog) => {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';
      Object.values(catalog.weapons).forEach(category => {
        category.forEach(w => {
          const card = document.createElement('div');
          card.className = 'weapon-card';
          card.innerHTML = `
            <div style="font-size: 2rem; margin-right: 12px;">${w.icon}</div>
            <div class="weapon-info" style="flex:1;">
              <div class="weapon-name">${w.name}</div>
              <div class="weapon-stats">Daño: ${w.damage} HP</div>
              <div class="weapon-price">$${w.price}</div>
            </div>
            <button class="btn btn-cyan" style="width: auto; padding: 6px 12px; margin:0;" onclick="buyWeapon('${w.id}')">Adquirir</button>
          `;
          grid.appendChild(card);
        });
      });
    });
    function buyWeapon(itemId) { socket.emit('shop:buy', { phone: player.phone, itemId, category: 'weapons' }); }
    socket.on('shop:success', (data) => {
      player = data.player;
      document.getElementById('dashMoney').textContent = player.money;
      alert(`¡Transacción exitosa! Adquiriste ${data.item.name}`);
    });
    socket.on('shop:error', (msg) => { alert(msg); });

    // ---------- LOBBY ----------
    function findMatch() {
      socket.emit('lobby:join', { phone: player.phone });
      document.getElementById('lobbyStatus').textContent = '📡 Sintonizando señal de combate...';
    }
    socket.on('lobby:status', ({ count }) => {
      document.getElementById('lobbyStatus').textContent = `Jugadores en espera: ${count}`;
    });

    // =========================================================
    // ================   ESCENA 3D (THREE.JS)   ================
    // =========================================================
    let scene, camera, renderer;
    const MAP_SIZE = 1000;
    const HALF = MAP_SIZE / 2;

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1a12);
      scene.fog = new THREE.Fog(0x0a1a12, 200, 900);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('threeContainer').appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0x88ccff, 0x223311, 0.9);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffffff, 0.8);
      sun.position.set(200, 400, 100);
      scene.add(sun);

      const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 20, 20);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x16321f, wireframe: false });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const grid = new THREE.GridHelper(MAP_SIZE, 40, 0x00f0ff, 0x0a3d4a);
      grid.position.y = 0.05;
      grid.material.opacity = 0.25;
      grid.material.transparent = true;
      scene.add(grid);

      const housePositions = [
        { x: -300, z: -200 }, { x: 250, z: 150 }, { x: -100, z: 300 },
        { x: 350, z: -300 }, { x: 0, z: -400 }
      ];
      housePositions.forEach(pos => buildHouse(pos.x, pos.z));

      window.addEventListener('resize', onWindowResize);
    }

    function buildHouse(cx, cz) {
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3f4a });
      const size = 60, height = 40, thick = 4;
      const group = new THREE.Group();

      const back = new THREE.Mesh(new THREE.BoxGeometry(size, height, thick), wallMat);
      back.position.set(0, height/2, -size/2);
      group.add(back);

      const left = new THREE.Mesh(new THREE.BoxGeometry(thick, height, size), wallMat);
      left.position.set(-size/2, height/2, 0);
      group.add(left);

      const right = new THREE.Mesh(new THREE.BoxGeometry(thick, height, size), wallMat);
      right.position.set(size/2, height/2, 0);
      group.add(right);

      const doorW = 18;
      const segW = (size - doorW) / 2;
      const frontL = new THREE.Mesh(new THREE.BoxGeometry(segW, height, thick), wallMat);
      frontL.position.set(-(doorW/2 + segW/2), height/2, size/2);
      group.add(frontL);
      const frontR = new THREE.Mesh(new THREE.BoxGeometry(segW, height, thick), wallMat);
      frontR.position.set((doorW/2 + segW/2), height/2, size/2);
      group.add(frontR);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(size + 6, 4, size + 6), new THREE.MeshStandardMaterial({ color: 0x1e2530 }));
      roof.position.set(0, height + 2, 0);
      group.add(roof);

      group.position.set(cx, 0, cz);
      scene.add(group);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function toWorld(sx, sy) {
      return { x: sx - HALF, z: sy - HALF };
    }

    function createPlayerMesh(id, isMe) {
      const group = new THREE.Group();
      const color = isMe ? 0x00f0ff : 0xf43f5e;

      const bodyMat = new THREE.MeshStandardMaterial({ color });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(4, 5, 14, 10), bodyMat);
      body.position.y = 9;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(4.2, 12, 12), bodyMat);
      head.position.y = 18;
      group.add(head);

      const nose = new THREE.Mesh(new THREE.ConeGeometry(1.5, 5, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      nose.rotation.x = Math.PI / 2;
      nose.position.set(0, 9, 6);
      group.add(nose);

      const nameSprite = makeNameSprite(players[id] ? players[id].name : '???');
      nameSprite.position.y = 26;
      group.add(nameSprite);

      scene.add(group);
      meshes[id] = { group, nameSprite };
    }

    function makeNameSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(2,6,23,0.6)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.font = 'bold 32px Rajdhani, Arial';
      ctx.fillStyle = '#00f0ff';
      ctx.textAlign = 'center';
      ctx.fillText(text, 128, 42);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(20, 5, 1);
      return sprite;
    }

    function removePlayerMesh(id) {
      if (meshes[id]) {
        scene.remove(meshes[id].group);
        delete meshes[id];
      }
    }

    // ---------- INICIO DE PARTIDA ----------
    socket.on('match:started', (data) => {
      matchId = data.matchId;
      myId = socket.id;
      players = {};
      data.players.forEach(p => { players[p.id] = p; });

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      document.getElementById('opName').textContent = player.name;
      document.getElementById('matchStatus').textContent = `Partida ${matchId}`;

      if (!scene) initScene();
      Object.keys(meshes).forEach(removePlayerMesh);
      Object.keys(players).forEach(id => createPlayerMesh(id, id === myId));

      if (!loopRunning) {
        loopRunning = true;
        requestAnimationFrame(gameLoop);
      }
    });

    socket.on('player:moved', ({ id, x, y, rotation }) => {
      if (players[id]) {
        players[id].x = x; players[id].y = y; players[id].rotation = rotation;
      }
    });

    socket.on('player:hit', ({ shooterId, targetId, targetHp, targetShield }) => {
      if (players[targetId]) {
        players[targetId].hp = targetHp;
        players[targetId].shield = targetShield;
      }
      if (targetId === myId) {
        document.getElementById('hpBarFill').style.width = Math.max(0, targetHp) + '%';
        document.getElementById('shieldBarFill').style.width = Math.max(0, targetShield) + '%';
      }
      drawTracer(shooterId, targetId);
    });

    function drawTracer(shooterId, targetId) {
      const s = meshes[shooterId], t = meshes[targetId];
      if (!s || !t) return;
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(s.group.position.x, 12, s.group.position.z),
        new THREE.Vector3(t.group.position.x, 12, t.group.position.z)
      ]);
      const mat = new THREE.LineBasicMaterial({ color: 0xffee00 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      setTimeout(() => scene.remove(line), 120);
    }

    socket.on('player:eliminated', ({ targetId, killerId }) => {
      if (players[targetId]) players[targetId].alive = false;
      const killerName = killerId && players[killerId] ? players[killerId].name : 'Zona';
      const targetName = players[targetId] ? players[targetId].name : '???';
      addKillfeed(`${killerName} eliminó a ${targetName}`);
      removePlayerMesh(targetId);
      if (targetId === myId) document.getElementById('matchStatus').textContent = 'Has sido eliminado';
    });

    socket.on('match:ended', ({ winnerId, winnerName }) => {
      const overlay = document.getElementById('endOverlay');
      document.getElementById('endMessage').textContent = (winnerId === myId)
        ? '🏆 VICTORIA ABSOLUTA'
        : (winnerName ? `🏆 Ganador: ${winnerName}` : 'Partida finalizada');
      overlay.style.display = 'flex';
    });

    function addKillfeed(text) {
      const el = document.getElementById('killfeed');
      const line = document.createElement('div');
      line.textContent = text;
      el.appendChild(line);
      setTimeout(() => line.remove(), 5000);
    }

    // ---------- DISPARO (mouse click en PC + botón táctil en móvil) ----------
    function fireAtClosest() {
      if (!scene || !myId || !players[myId] || !players[myId].alive) return;
      let closest = null, closestDist = Infinity;
      for (const id in players) {
        if (id === myId || !players[id].alive) continue;
        const dx = players[id].x - players[myId].x;
        const dy = players[id].y - players[myId].y;
        const d = Math.hypot(dx, dy);
        if (d < closestDist) { closestDist = d; closest = id; }
      }
      if (closest) socket.emit('player:shoot', { targetId: closest });
    }

    window.addEventListener('click', (e) => {
      if (e.target.closest('#fireBtn') || e.target.closest('#joystickZone')) return;
      fireAtClosest();
    });

    document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
      e.preventDefault();
      fireAtClosest();
    }, { passive: false });

    // ---------- TECLADO (PC) ----------
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // ---------- JOYSTICK VIRTUAL (MÓVIL) ----------
    let joystickTouchId = null;
    let joyDX = 0, joyDY = 0; // valores -1 a 1

    const joystickZone = document.getElementById('joystickZone');
    const joystickStick = document.getElementById('joystickStick');
    const JOY_RADIUS = 50;

    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
    }, { passive: false });

    joystickZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        if (touch.identifier !== joystickTouchId) continue;
        const rect = joystickZone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = touch.clientX - cx;
        let dy = touch.clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > JOY_RADIUS) {
          dx = (dx / dist) * JOY_RADIUS;
          dy = (dy / dist) * JOY_RADIUS;
        }
        joystickStick.style.left = (35 + dx) + 'px';
        joystickStick.style.top = (35 + dy) + 'px';
        joyDX = dx / JOY_RADIUS;
        joyDY = dy / JOY_RADIUS;
      }
    }, { passive: false });

    function resetJoystick(e) {
      for (const touch of e.changedTouches) {
        if (touch.identifier !== joystickTouchId) continue;
        joystickTouchId = null;
        joyDX = 0; joyDY = 0;
        joystickStick.style.left = '35px';
        joystickStick.style.top = '35px';
      }
    }
    joystickZone.addEventListener('touchend', resetJoystick);
    joystickZone.addEventListener('touchcancel', resetJoystick);

    // ---------- LOOP ----------
    function gameLoop(ts) {
      if (myId && players[myId] && players[myId].alive) {
        const me = players[myId];
        let dx = 0, dy = 0;
        if (keys['w']) dy -= MOVE_SPEED;
        if (keys['s']) dy += MOVE_SPEED;
        if (keys['a']) dx -= MOVE_SPEED;
        if (keys['d']) dx += MOVE_SPEED;
        // Joystick táctil (móvil)
        dx += joyDX * MOVE_SPEED;
        dy += joyDY * MOVE_SPEED;

        if (dx !== 0 || dy !== 0) {
          me.x = Math.max(0, Math.min(MAP_SIZE, me.x + dx));
          me.y = Math.max(0, Math.min(MAP_SIZE, me.y + dy));
          me.rotation = Math.atan2(dx, -dy);
          if (ts - lastSent > 50) {
            socket.emit('player:move', { x: me.x, y: me.y, rotation: me.rotation });
            lastSent = ts;
          }
        }
      }

      syncMeshes();
      updateCamera();
      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    function syncMeshes() {
      for (const id in players) {
        if (!players[id].alive) continue;
        if (!meshes[id]) createPlayerMesh(id, id === myId);
        const w = toWorld(players[id].x, players[id].y);
        const m = meshes[id].group;
        m.position.x += (w.x - m.position.x) * 0.35;
        m.position.z += (w.z - m.position.z) * 0.35;
        m.rotation.y = players[id].rotation || 0;
      }
    }

    function updateCamera() {
      if (!myId || !meshes[myId]) return;
      const target = meshes[myId].group.position;
      const rot = players[myId] ? players[myId].rotation || 0 : 0;
      const camDist = 45, camHeight = 28;
      const camX = target.x - Math.sin(rot) * camDist;
      const camZ = target.z + Math.cos(rot) * camDist;
      camera.position.x += (camX - camera.position.x) * 0.15;
      camera.position.z += (camZ - camera.position.z) * 0.15;
      camera.position.y += (target.y + camHeight - camera.position.y) * 0.15;
      camera.lookAt(target.x, target.y + 12, target.z);
    }
  </script>
</body>
